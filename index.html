<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مبادرة مدرستي تزدهر - الأسبوع الثالث عشر</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
            text-align: center;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 24px;
        }
        .subtitle {
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 16px;
        }
        .chart-box {
            margin: 20px auto;
            padding: 15px;
            background: #fafafa;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            max-width: 100%;
        }
        .chart-box img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
        }
        .nav-title {
            font-size: 18px;
            font-weight: bold;
            margin-top: 30px;
            margin-bottom: 15px;
            color: #34495e;
        }
        .button-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            color: #fff;
            border-radius: 6px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .btn-first { background-color: #34495e; }
        .btn-first:hover { background-color: #2c3e50; }
        .btn-second { background-color: #2980b9; }
        .btn-second:hover { background-color: #216a94; }
        .btn-third { background-color: #8e44ad; }
        .btn-third:hover { background-color: #732691; }
    </style>
</head>
<body>

<div class="container">
    <h1>بيانات الأسبوع الثالث عشر - المقارنة العامة</h1>
    <div class="subtitle">مبادرة مدرستي تزدهر: سباق محموم بين فصول المرحلة المتوسطة</div>
    
    <div class="chart-box">
        <!-- هنا يظهر الرسم البياني المجمع الثنائي الأبعاد -->
        <img src="https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=1000&q=80" alt="الرسم البياني المجمع للأسبوع الثالث عشر">
        <p style="font-size: 12px; color: #7f8c8d; margin-top: 8px;">(مخطط توضيحي للرسم البياني المجمع والشامل للصفوف الثلاثة)</p>
    </div>

    <div class="nav-title">اضغط على أحد الصفوف التالية للاطلاع على تقريره التفصيلي ولوحة النجوم:</div>
    
    <div class="button-group">
        <a href="first.html" class="btn btn-first">الصف الأول المتوسط</a>
        <a href="second.html" class="btn btn-second">الصف الثاني المتوسط</a>
        <a href="third.html" class="btn btn-third">الصف الثالث المتوسط</a>
    </div>
</div>

</body>
</html>
