<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة صدارة الصف الثاني المتوسط</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
            text-align: center;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .header {
            background-color: #2980b9;
            color: white;
            padding: 20px;
            border-radius: 8px;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 25px;
        }
        .content-box {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            background: #faf8f5;
            margin-bottom: 30px;
            min-height: 300px;
        }
        .placeholder-text {
            color: #7f8c8d;
            font-size: 16px;
            margin-top: 100px;
        }
        .btn-back {
            display: inline-block;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            color: white;
            background-color: #e74c3c;
            border-radius: 6px;
            transition: background 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .btn-back:hover {
            background-color: #333;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">الصف الثاني المتوسط - الأسبوع الثالث عشر</div>
    
    <div class="content-box">
        <p class="placeholder-text">[ هنا يتم عرض لوحة الصدارة الكاملة، "نجوم الأسبوع"، والمؤشرات التفصيلية الخاصة بـ الصف الثاني المتوسط تماماً كما في الصورة الأصلية المحملة ]</p>
    </div>

    <a href="index.html" class="btn-back">العودة للصفحة الرئيسية</a>
</div>

</body>
</html>
